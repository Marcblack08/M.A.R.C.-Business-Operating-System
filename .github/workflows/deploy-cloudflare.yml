name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Cloudflare credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          if [ -z "${CF_API_TOKEN}" ]; then
            echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN en GitHub Actions."
            exit 1
          fi
          if [ -z "${CF_ACCOUNT_ID}" ]; then
            echo "::error::Falta el secreto CLOUDFLARE_ACCOUNT_ID en GitHub Actions."
            exit 1
          fi
          echo "Credenciales de Cloudflare detectadas correctamente."

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.143.0"
          packageManager: npm
          command: deploy --config wrangler.toml
