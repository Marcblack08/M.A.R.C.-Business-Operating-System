<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M.A.R.C. · Prueba de acceso por correo</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111d;color:#eef7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:20px}.card{width:min(460px,100%);background:#0d1c2b;border:1px solid #23425d;border-radius:20px;padding:28px;box-shadow:0 24px 70px #0008}.logo{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:#1388e8;font-size:25px;font-weight:800;margin-bottom:18px}h1{margin:0 0 8px;font-size:25px}.sub{margin:0 0 24px;color:#9fb4c8;line-height:1.5}label{display:block;margin:14px 0 7px;font-size:13px;color:#b9cad8}input{width:100%;padding:14px;border-radius:12px;border:1px solid #2a4962;background:#091522;color:#fff;outline:none}input:focus{border-color:#168de8}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#168de8;color:white;font-weight:750;cursor:pointer}button:disabled{opacity:.6}.msg{min-height:44px;margin-top:16px;padding:12px;border-radius:10px;background:#091522;color:#b9cad8;white-space:pre-wrap}.ok{border:1px solid #287b55;color:#a8e7c5}.err{border:1px solid #8a3b3b;color:#ffb5b5}.user{margin-top:16px;padding:12px;border-radius:10px;background:#0a1724;color:#cce0ef;font-size:13px;word-break:break-word}.actions{display:grid;gap:10px;margin-top:14px}.secondary{background:#152a3d}small{display:block;margin-top:18px;color:#71879a;line-height:1.5}
</style></head>
<body><main class="card">
<div class="logo">M</div>
<h1>Prueba de acceso por correo</h1>
<p class="sub">Pantalla independiente de <code>app.js</code>. Comprueba directamente correo + contraseña contra Supabase.</p>
<form id="loginForm" autocomplete="on">
<label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" required placeholder="tu@correo.com">
<label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="Tu contraseña">
<button id="loginButton" type="submit">Iniciar sesión con correo</button>
</form>
<div id="message" class="msg">Esperando prueba…</div>
<div id="session" class="user">Sesión: comprobando…</div>
<div class="actions"><button id="openApp" class="secondary" type="button">Abrir M.A.R.C.</button><button id="logout" class="secondary" type="button">Cerrar sesión de prueba</button></div>
<small>Si aquí funciona, Supabase y las credenciales están bien y el problema queda aislado en el arranque de la aplicación principal.</small>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js?v=20260924-login-test"></script>
<script>
(()=>{const C=window.MARC_CONFIG,msg=document.getElementById("message"),sessionBox=document.getElementById("session"),form=document.getElementById("loginForm"),button=document.getElementById("loginButton");
if(!C?.supabaseUrl||!C?.supabasePublishableKey){msg.className="msg err";msg.textContent="No se encontró la configuración de Supabase.";return}
const client=window.supabase.createClient(C.supabaseUrl,C.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
function showSession(session){sessionBox.textContent=session?.user?"Sesión activa: "+(session.user.email||session.user.id):"Sesión: no iniciada"}
client.auth.getSession().then(({data})=>showSession(data?.session));
client.auth.onAuthStateChange((event,session)=>{showSession(session);if(event==="SIGNED_IN"){msg.className="msg ok";msg.textContent="CORREO + CONTRASEÑA FUNCIONAN. Supabase aceptó las credenciales."}});
form.addEventListener("submit",async event=>{event.preventDefault();button.disabled=true;msg.className="msg";msg.textContent="Comprobando correo y contraseña…";const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;try{const {data,error}=await client.auth.signInWithPassword({email,password});if(error)throw error;if(!data?.session)throw new Error("Supabase no devolvió una sesión.");showSession(data.session);msg.className="msg ok";msg.textContent="INICIO DE SESIÓN CORRECTO. La cuenta fue autenticada por correo."}catch(error){msg.className="msg err";msg.textContent="FALLÓ EL INICIO DE SESIÓN\n"+(error?.message||String(error));showSession(null)}finally{button.disabled=false}});
document.getElementById("openApp").onclick=()=>location.href="./index.html";
document.getElementById("logout").onclick=async()=>{await client.auth.signOut();showSession(null);msg.className="msg";msg.textContent="Sesión de prueba cerrada."};
})();
</script></body></html>
